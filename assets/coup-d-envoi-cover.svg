  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="drop" x="-60%" y="-50%" width="220%" height="220%"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dx="0" dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="pitchClip"><path d="M490 250 1580 160 1650 1040 260 1040Z"/></clipPath>
