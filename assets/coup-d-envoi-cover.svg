<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050a0d"/><stop offset=".48" stop-color="#101e22"/><stop offset="1" stop-color="#040807"/></linearGradient>
  <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#030707" stop-opacity=".97"/><stop offset=".43" stop-color="#030707" stop-opacity=".78"/><stop offset=".72" stop-color="#030707" stop-opacity=".12"/><stop offset="1" stop-color="#030707" stop-opacity="0"/></linearGradient>
  <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#32784b"/><stop offset=".58" stop-color="#155133"/><stop offset="1" stop-color="#092d20"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffac66"/><stop offset=".48" stop-color="#ff7338"/><stop offset="1" stop-color="#e84419"/></linearGradient>
  <linearGradient id="whiteKit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#bfcbd0"/></linearGradient>
  <linearGradient id="redKit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7448"/><stop offset="1" stop-color="#9f1b21"/></linearGradient>
  <radialGradient id="lamp"><stop stop-color="#fff" stop-opacity=".9"/><stop offset=".2" stop-color="#d7f7ff" stop-opacity=".45"/><stop offset="1" stop-color="#8edcff" stop-opacity="0"/></radialGradient>
  <radialGradient id="warm"><stop stop-color="#ff6a2b" stop-opacity=".28"/><stop offset="1" stop-color="#ff6a2b" stop-opacity="0"/></radialGradient>
  <pattern id="crowd" width="42" height="24" patternUnits="userSpaceOnUse"><path d="M2 8l3-4 3 4M15 14l3-4 3 4M30 5l3-4 3 4" fill="none" stroke="#a6b6bc" stroke-opacity=".28" stroke-width="2"/><circle cx="8" cy="17" r="2" fill="#e5ddd0" fill-opacity=".45"/><circle cx="27" cy="18" r="2" fill="#ff8551" fill-opacity=".48"/></pattern>
